# Nombre de la aplicación para identificarla en logs y en la consola de Spring.
spring.application.name=operacion-ultima-milla

# Muestra el mensaje de error completo en respuestas HTTP para facilitar depuración.
server.error.include-message=always

# Configuración de la base de datos H2.
# jdbc:h2:file:./data/inventario significa:
# - usa la base H2
# - guarda la información en un archivo local dentro de la carpeta data/
# - el nombre del archivo es inventario
# Esto hace que productos, ventas, pedidos y cambios se guarden permanentemente en disco.
spring.datasource.url=jdbc:h2:file:./data/inventario
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza automáticamente la estructura de tablas de la base de datos.
# Con update, si existen tablas, las mantiene y ajusta sin perder información.
spring.jpa.hibernate.ddl-auto=update

# Habilita la consola web de H2 para consultar la base de datos desde el navegador.
# Ejemplo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
